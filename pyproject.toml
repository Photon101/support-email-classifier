[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "support-email-classifier"
version = "0.1.0"
description = "Deterministic support email classification starter with audit output"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Photon101" }]
keywords = ["support", "email", "classification", "automation", "csv"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business",
]

[project.scripts]
support-email-classifier = "support_email_classifier.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
